<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="아주대학교 합창단 글리의 출석과 연습 일정">
<title>Glee통합관리</title>
<!-- 탭 아이콘: PNG는 사파리용, SVG는 그 외 브라우저가 우선 사용 -->
<link rel="icon" type="image/png" href="/assets/glee-icon.png">
<link rel="icon" type="image/svg+xml" href="/assets/glee-logo.svg">
<!-- iOS '홈 화면에 추가' 아이콘. SVG를 못 받고 투명 배경을 검정으로 칠하므로 흰 배경 PNG -->
<link rel="apple-touch-icon" href="/assets/glee-icon.png">
<meta name="apple-mobile-web-app-title" content="글리">
<!-- 홈 화면에서 열면 주소창 없는 전체화면. 뒤로가기는 화면 안의 링크와 가장자리 스와이프 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<a class="skip-link" href="#view">본문으로 이동</a>
<div class="app-shell">
<header class="top">
  <a href="#/home" class="brand" aria-label="글리 홈">
    <span class="logo-window"><img src="/assets/glee-logo.svg" alt="Glee — Choir Club of Ajou" width="1256" height="778"></span>
  </a>
  <div class="account">
    <span id="user"></span>
    <button type="button" id="logout" class="link" hidden>로그아웃</button>
  </div>
</header>
<nav id="tabs" class="tabs" aria-label="주 메뉴" hidden>
  <a href="#/home" data-tab="attendance"><img class="ui-icon" src="/assets/attendance.svg" alt="" width="20" height="20">출석</a>
  <a href="#/schedule" data-tab="schedule"><img class="ui-icon" src="/assets/calendar.svg" alt="" width="20" height="20">일정</a>
</nav>
<main id="view" tabindex="-1"></main>
<footer class="app-footer">GLEE통합관리 <span>made by 지완</span></footer>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
